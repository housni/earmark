name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check tag matches manifest and package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          package=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$manifest" ] || [ "$TAG" != "$package" ]; then
            echo "::error::Tag $TAG doesn't match manifest.json ($manifest) and package.json ($package). Bump with 'npm version'."
            exit 1
          fi

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir earmark
          cp main.js manifest.json styles.css earmark/
          zip -r "earmark-$TAG.zip" earmark

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            main.js manifest.json styles.css "earmark-$TAG.zip"
